
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kwaheri Waalimu - Vincent Nyerere Maile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

.container{max-width:700px;margin:0 auto}

.subject{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.subject b{font-size:13px}
.subject input,.subject textarea{width:100%;padding:11px;border:2px solid #e2e8f0;border-radius:10px;margin-top:8px;font-size:12px}
.btn{width:100%;background:#0f172a;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700;margin-top:8px;cursor:pointer}

</head>
<body>
<div class="container">
<div class="header">
<div class="badge">VINCENT NYERERE MAILE</div>
<div class="reg">01-032026-02-99936</div>
<h3>🎓 Kwaherini Waalimu Wangu</h3>
<p style="font-size:11px;color:#475569;margin-top:6px">Maoni yanatumwa kwa Email tu - Salama 100%</p>
</div>

<div class="subject"><b>💻 Programming</b><input id="n1" placeholder="Jina la Mwalimu"><textarea id="m1" rows="3" placeholder="Maoni yako..."></textarea><button class="btn" onclick="send('Programming','n1','m1','o1')">TUMA EMAIL 📧</button><div id="o1" class="success"></div></div>

<div class="subject"><b>📡 Networking</b><input id="n3" placeholder="Jina la Mwalimu"><textarea id="m3" rows="3" placeholder="Maoni yako..."></textarea><button class="btn" onclick="send('Networking','n3','m3','o3')">TUMA EMAIL 📧</button><div id="o3" class="success"></div></div>

<div class="subject"><b>📊 Applied Maths</b><input id="n4" placeholder="Jina la Mwalimu"><textarea id="m4" rows="3" placeholder="Maoni yako..."></textarea><button class="btn" onclick="send('Applied Maths','n4','m4','o4')">TUMA EMAIL 📧</button><div id="o4" class="success"></div></div>

<script>
const EMAIL="vincentnyerere4@gmail.com";
async function send(somo,nId,mId,oId){
const jina=document.getElementById(nId).value;
const maoni=document.getElementById(mId).value;
const box=document.getElementById(oId);
if(!jina||!maoni){alert("Jaza jina na maoni");return;}
box.style.display="block";box.innerText="⏳ Inatuma...";
await fetch("https://formsubmit.co/ajax/"+EMAIL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({Somo:somo,Mwalimu:jina,Maoni:maoni,Reg:"01-032026-02-99936"})});
box.innerText="✅ Asante Mwalimu "+jina+" - Maoni ya "+somo+" yametumwa kwa Email";
document.getElementById(nId).value="";document.getElementById(mId).value="";
}
</script>
